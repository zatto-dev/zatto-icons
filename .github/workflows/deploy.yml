name: build-and-deploy

on:
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC
  workflow_dispatch:
    inputs:
      update_sources:
        description: "Resolve the newest upstream commits instead of using sources.lock"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (sanitizers)
        run: node --test test/sanitize-svg.test.mjs test/sanitize-png.test.mjs

      - name: Fetch sources
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.update_sources }}" = "true" ]; then
            npm run update-lock
          else
            npm run fetch
          fi

      - name: Build
        run: npm run build

      - name: Verify dist
        run: node --test test/dist.test.mjs

      # Cloudflare credentials are only exposed to this one step; the build above runs without secrets.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages deploy dist --project-name zatto-icons --branch main --commit-dirty=true
